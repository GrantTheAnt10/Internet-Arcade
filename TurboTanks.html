<script>
/* =====================================================================
   ARCADE KIT — shared by the Internet Arcade canvas games.
   Canvas scaling, keyboard / gamepad / touch / cabinet input, sound,
   high scores and the cabinet message protocol.
   ===================================================================== */
'use strict';
const TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + (b - a) * Math.random();
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// gamepads may be blocked (e.g. inside an iframe opened from file://); that must never stop a game
function safePads() { try { return (navigator.getGamepads && navigator.getGamepads()) || []; } catch (e) { return []; } }

const Kit = {
  W: 480, H: 360, scale: 1, ox: 0, oy: 0, t: 0,
  embed: /[?&]embed=1\b/.test(location.search) && window.parent !== window,
  keys: Object.create(null), prev: Object.create(null), touch: Object.create(null), pulse: Object.create(null),
  // logical buttons -> physical keys (the cabinet sends KeyJ/KeyK/KeyL/KeyI for its four buttons)
  MAP: {
    left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'],
    a: ['KeyJ', 'KeyZ', 'Space'], b: ['KeyK', 'KeyX'], c: ['KeyL', 'KeyC', 'ShiftLeft', 'ShiftRight'], d: ['KeyI', 'KeyV'], e: ['KeyU'], f: ['KeyO'],
    start: ['Enter'], pause: ['Escape', 'KeyP'],
  },
  pad: Object.create(null), padPrev: Object.create(null), stick: { x: 0, y: 0 },
  init(opts) {
    Object.assign(this, opts);
    const c = this.canvas = document.createElement('canvas');
    c.id = 'screen'; document.body.appendChild(c);
    this.ctx = c.getContext('2d');
    if (this.embed) { document.documentElement.classList.add('embed'); parent.postMessage({ type: 'hh-ready' }, '*'); }
    addEventListener('resize', () => this.resize()); this.resize();
    addEventListener('keydown', e => {
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
      this.down(e.code);

    addEventListener('keyup', e => this.up(e.code));
    addEventListener('blur', () => { for (const k in this.keys) this.keys[k] = false; });
    addEventListener('message', e => {

      const d = e.data; if (!d || typeof d !== 'object') return;
      if (d.type === 'hh-key' && typeof d.code === 'string' && d.code.length < 24) d.down ? this.down(d.code) : this.up(d.code);
      else if (d.type === 'hh-start') { this.audioInit(); this.onStart && this.onStart(); }
      else if (d.type === 'hh-release') for (const k in this.keys) this.keys[k] = false;
    });

  },
  down(code) {

    if (this.MAP.pause.includes(code)) {
      if (code === 'Escape' && this.embed && this.onTitle && this.onTitle()) { parent.postMessage({ type: 'hh-exit' }, '*'); return; }
      this.onPause && this.onPause();

  },
  up(code) { this.keys[code] = false; },
  held(name) {

  },
  // a key counts as held for at least one game step, so very quick taps are never lost
  isDown(code) { return !!(this.keys[code] || this.pulse[code]); },
  // true only on the step the button went down
  hit(name) { return this.held(name) && !this.prev[name]; },
  latch() { for (const n in this.MAP) this.prev[n] = this.held(n); for (const k in this.pulse) delete this.pulse[k]; },
  axisX() { return this.stick.x || ((this.held('right') ? 1 : 0) - (this.held('left') ? 1 : 0)); },
  axisY() { return this.stick.y || ((this.held('down') ? 1 : 0) - (this.held('up') ? 1 : 0)); },
  pollPad() {

    const P = this.pad; for (const k in P) P[k] = false; this.stick.x = this.stick.y = 0;
    for (const p of pads) {
      if (!p) continue;
      const b = i => p.buttons[i] && (p.buttons[i].pressed || p.buttons[i].value > 0.4);
      const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
      if (Math.abs(ax) > 0.25) this.stick.x = ax; if (Math.abs(ay) > 0.25) this.stick.y = ay;

      P.a = P.a || b(0); P.b = P.b || b(1); P.c = P.c || b(2); P.d = P.d || b(3); P.e = P.e || b(5); P.f = P.f || b(7);

  resize() {

    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);

  },
  // map a client point to logical coordinates
  toLogical(cx, cy) { return { x: (cx * this.dpr - this.ox) / this.scale, y: (cy * this.dpr - this.oy) / this.scale }; },
  begin(bg = '#000') {
    const g = this.ctx, c = this.canvas;

  },
  end() { this.ctx.restore(); },

  /* ---------- text ---------- */
  text(s, x, y, size, color = '#fff', align = 'center', opts = {}) {

    g.font = `${opts.italic === false ? '' : 'italic '}900 ${size}px "Arial Black", Impact, sans-serif`;
    g.textAlign = align; g.textBaseline = 'middle';
    if (opts.glow) { g.shadowColor = opts.glow; g.shadowBlur = opts.blur || size * 0.6; }
    if (opts.stroke !== false) { g.lineWidth = Math.max(2, size * 0.14); g.strokeStyle = opts.stroke || '#1a0b02'; g.lineJoin = 'round'; g.strokeText(s, x, y); }

    g.shadowBlur = 0;
  },
  mono(s, x, y, size, color = '#fff', align = 'left') {
    const g = this.ctx; g.font = `bold ${size}px ui-monospace, "Courier New", monospace`;
    g.textAlign = align; g.textBaseline = 'middle'; g.fillStyle = color; g.fillText(s, x, y);
  },
  blink(rate = 1.6) { return Math.floor(this.t * rate * 2) % 2 === 0; },

  /* ---------- sound ---------- */
  ac: null,
  audioInit() {

  tone(f, dur = 0.1, vol = 0.2, type = 'square', slide = 0, delay = 0) {

  noise(dur = 0.2, vol = 0.3, freq = 1200, type = 'lowpass', delay = 0) {

  /* ---------- high scores ---------- */
  hi(key) { try { return +localStorage.getItem('ia-hi-' + key) || 0; } catch (e) { return 0; } },
  setHi(key, v) { try { if (v > this.hi(key)) { localStorage.setItem('ia-hi-' + key, v); return true; } } catch (e) { } return false; },

  /* ---------- touch controls when the game is opened on its own ---------- */
  buildTouch() {
    const box = document.createElement('div'); box.id = 'touch'; document.body.appendChild(box);
    const mk = (name, label, css) => {
      const d = document.createElement('div'); d.className = 'tbtn'; d.textContent = label; Object.assign(d.style, css); box.appendChild(d);
      const on = e => { e.preventDefault(); this.touch[name] = true; d.classList.add('on'); this.audioInit(); if (name === 'start') this.onStart && this.onStart(); };

    mk('up', '▲', { left: '66px', bottom: '124px' }); mk('down', '▼', { left: '66px', bottom: '16px' });
    if (L.a) mk('a', L.a, { right: '16px', bottom: '40px' });
    if (L.b) mk('b', L.b, { right: '90px', bottom: '20px' });
    if (L.c) mk('c', L.c, { right: '30px', bottom: '116px' });
    if (L.d) mk('d', L.d, { right: '104px', bottom: '96px' });
    if (L.e) mk('e', L.e, { right: '178px', bottom: '76px' });
    if (L.f) mk('f', L.f, { right: '178px', bottom: '150px' });

  },

/* ---------- small helpers used by several games ---------- */
class Particles {
  constructor() { this.list = []; }
  burst(x, y, n, colors, speed = 120, life = 0.6, size = 2, grav = 0) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = speed * (0.3 + Math.random() * 0.7);
      this.list.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.5 + Math.random() * 0.5), max: life, size: size * (0.6 + Math.random() * 0.8), c: pick(colors), grav });
    }
  }
  update(dt) {
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i]; p.life -= dt; if (p.life <= 0) { L.splice(i, 1); continue; }
      p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.985; p.vy *= 0.985;
    }
  }
  draw(g) {
    for (const p of this.list) { g.globalAlpha = clamp(p.life / p.max, 0, 1); g.fillStyle = p.c; g.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
    g.globalAlpha = 1;
  }
  clear() { this.list.length = 0; }
}

/* =====================================================================
   TURBO TANKS — top-down arena tank battle
   ===================================================================== */
const TS = 20, GW = 24, GH = 17, OY = 20;          // tile size, grid, HUD height
const MAPS = [
  ['########################',
   '#P.....................#',
   '#......................#',
   '#...bbbb........bbbb...#',
   '#...b..............b...#',
   '#...b....#....#....b...#',
   '#........#....#........#',
   '#....bb..........bb....#',
   '#....bb...wwww...bb....#',
   '#....bb..........bb....#',
   '#........#....#........#',
   '#...b....#....#....b...#',
   '#...b..............b...#',
   '#...bbbb........bbbb...#',
   '#......................#',
   '#E..........E.........E#',
   '########################'],
  ['########################',
   '#E.........##.........E#',
   '#..........##..........#',
   '#..bbb..........bbb....#',
   '#..b..b...bbbb..b..b...#',
   '#.....b..........b.....#',
   '#...www...#..#...www...#',
   '#...www...#..#...www...#',
   '#..........bb..........#',
   '#....b.....bb.....b....#',
   '#....b...#....#...b....#',
   '#....bbbb#....#bbbb....#',
   '#......................#',
   '#..###............###..#',
   '#......................#',
   '#P.........##.........E#',
   '########################'],
  ['########################',
   '#P..b......#.....b....E#',
   '#...b......#.....b.....#',
   '#...b..bbbb#bbbb.b.....#',
   '#...b............b.....#',
   '#...######..######.....#',
   '#......................#',
   '#.bbb....wwwwww....bbb.#',
   '#.b......wwwwww......b.#',
   '#.bbb....wwwwww....bbb.#',
   '#......................#',
   '#.....######..######...#',
   '#.....b............b...#',
   '#.....b.bbbb#bbbb..b...#',
   '#.....b.....#......b...#',
   '#E....b.....#.....Eb..E#',
   '########################'],
];
const TYPES = {
  grunt: { col: '#a8743a', speed: 46, hp: 1, fire: 2.2, shell: 190, bounce: 1, pts: 100 },
  fast: { col: '#3bb34a', speed: 92, hp: 1, fire: 1.8, shell: 210, bounce: 0, pts: 200 },
  rico: { col: '#9b4bff', speed: 52, hp: 1, fire: 1.6, shell: 240, bounce: 2, pts: 250 },
  heavy: { col: '#7a8290', speed: 34, hp: 3, fire: 2.6, shell: 170, bounce: 0, big: true, pts: 400 },
  miner: { col: '#e8c42a', speed: 60, hp: 1, fire: 3.0, shell: 190, bounce: 1, mines: true, pts: 300 },
};
const S = {
  mode: 'title', level: 0, score: 0, hi: 0, lives: 3, grid: [], bricks: {}, tanks: [], shells: [], mines: [], drops: [],
  fx: new Particles(), smoke: new Particles(), msg: '', msgT: 0, paused: false, mouse: null, queue: [], spawnT: 0, shake: 0,
};

/* ---------- map ---------- */
function genMap(n) {
  // symmetric random arena, kept connected
  for (let tries = 0; tries < 40; tries++) {
    const g = []; for (let y = 0; y < GH; y++) g.push([...'#' + '.'.repeat(GW - 2) + '#']);
    for (let x = 0; x < GW; x++) { g[0][x] = '#'; g[GH - 1][x] = '#'; }
    const blocks = 7 + Math.min(n, 8);
    for (let i = 0; i < blocks; i++) {
      const w = randi(1, 4), h = randi(1, 3), x = randi(2, GW / 2 - w), y = randi(2, GH - 3 - h), t = pick(['b', 'b', 'b', '#', 'w']);

    }
    g[1][1] = 'P'; g[1][GW - 2] = 'E'; g[GH - 2][GW - 2] = 'E'; g[GH - 2][1] = 'E'; g[GH - 2][GW >> 1] = 'E';
    for (const [x, y] of [[1, 1], [2, 1], [1, 2], [GW - 2, 1], [GW - 3, 1], [GW - 2, GH - 2], [GW - 3, GH - 2], [1, GH - 2], [2, GH - 2], [GW >> 1, GH - 2]]) if (g[y][x] !== 'P' && g[y][x] !== 'E') g[y][x] = '.';

}
function connected(rows) {

function loadLevel() {
  const rows = S.level < MAPS.length ? MAPS[S.level] : genMap(S.level);
  S.grid = rows.map(r => [...r]); S.bricks = {}; S.tanks = []; S.shells = []; S.mines = []; S.drops = []; resetDecals(); S.fx.clear(); S.smoke.clear();
  S.spawns = [];

    const c = S.grid[y][x];
    if (c === 'b') S.bricks[y * GW + x] = 2;
    if (c === 'P') { S.pspawn = [x, y]; S.grid[y][x] = '.'; }
    if (c === 'E') { S.spawns.push([x, y]); S.grid[y][x] = '.'; }

  const p = S.player = makeTank('player', S.pspawn[0], S.pspawn[1]); p.inv = 2; S.tanks.push(p);

const tile = (x, y) => (S.grid[y] && S.grid[y][x]) || '#';
const blocksTank = c => c === '#' || c === 'b' || c === 'w';
const blocksShell = c => c === '#' || c === 'b';
const at = (px, py) => tile(Math.floor(px / TS), Math.floor((py - OY) / TS));

/* ---------- tanks ---------- */
function makeTank(kind, tx, ty) {
  const T = kind === 'player' ? { col: '#2fe6ff', speed: 78, hp: 5, shell: 230, bounce: 1 } : TYPES[kind];
  return { kind, T, seed: Math.random() * 1000, trackAcc: 0, x: tx * TS + TS / 2, y: OY + ty * TS + TS / 2, ang: kind === 'player' ? 0 : Math.PI, tur: Math.PI / 2, hp: T.hp, reload: 1 + Math.random(), tread: 0, path: [], pathT: 0, boost: 0, cool: 0, inv: 0, mineT: 3 + Math.random() * 3, rapid: 0 };
}
function canStand(x, y, r = 8) {
  for (const [dx, dy] of [[-r, -r], [r, -r], [-r, r], [r, r], [0, -r], [0, r], [-r, 0], [r, 0]]) if (blocksTank(at(x + dx, y + dy))) return false;
  return true;
}
function moveTank(t, dx, dy) {
  if (dx && canStand(t.x + dx, t.y)) t.x += dx;
  if (dy && canStand(t.x, t.y + dy)) t.y += dy;
  t.tread += Math.hypot(dx, dy);
  // lay a pair of tread prints every few pixels travelled
  t.trackAcc += Math.hypot(dx, dy);
  while (t.trackAcc >= 3) { t.trackAcc -= 3; stampTreads(t); }
}
function fire(t) {
  const big = t.T.big, sp = t.T.shell;
  const x = t.x + Math.cos(t.tur) * 13, y = t.y + Math.sin(t.tur) * 13;
  if (blocksShell(at(x, y))) return;
  S.shells.push({ x, y, vx: Math.cos(t.tur) * sp, vy: Math.sin(t.tur) * sp, owner: t, bounces: t.T.bounce + (t.kind === 'player' && t.rapid > 0 ? 1 : 0), r: big ? 4 : 2.5, life: 6 });
  S.smoke.burst(x, y, 5, ['#ccc', '#999'], 40, 0.5, 4);
  Kit.noise(0.12, t.kind === 'player' ? 0.25 : 0.12, big ? 500 : 1100);
}
/* ---------- ground decals: tread tracks and scorch marks, faded out slowly ---------- */
function resetDecals() {
  if (!S.decal) { S.decal = document.createElement('canvas'); S.decal.width = 960; S.decal.height = 720; S.dctx = S.decal.getContext('2d'); }
  S.dctx.setTransform(1, 0, 0, 1, 0, 0); S.dctx.clearRect(0, 0, 960, 720); S.dctx.setTransform(2, 0, 0, 2, 0, 0); S.fadeT = 0;
}

/* ---------- update ---------- */

/* ---------- draw ---------- */

  g.save(); g.globalCompositeOperation = 'lighter';
  const glow = g.createRadialGradient(bx, by, 1, bx, by, 22 + Math.sin(k) * 3);
  glow.addColorStop(0, 'rgba(255,150,40,.45)'); glow.addColorStop(1, 'rgba(255,80,0,0)');
  g.fillStyle = glow; g.beginPath(); g.arc(bx, by, 26, 0, TAU); g.fill();
  for (let i = 0; i < 5; i++) {
    const ox = Math.sin(k * 0.7 + i * 2.1) * 3.5, oy = Math.cos(k * 0.9 + i * 1.7) * 2.5, h = 6 + Math.abs(Math.sin(k + i)) * 6, w = 2.4 + (i % 2);
    const fx = bx + ox, fy = by + oy;
    const fg = g.createLinearGradient(fx, fy + 2, fx, fy - h);
    fg.addColorStop(0, 'rgba(255,240,170,.95)'); fg.addColorStop(0.4, 'rgba(255,150,30,.85)'); fg.addColorStop(1, 'rgba(255,40,0,0)');
    g.fillStyle = fg; g.beginPath(); g.moveTo(fx - w, fy + 1.5); g.quadraticCurveTo(fx - w * 0.6, fy - h * 0.6, fx + Math.sin(k + i) * 1.5, fy - h); g.quadraticCurveTo(fx + w * 0.6, fy - h * 0.6, fx + w, fy + 1.5); g.closePath(); g.fill();
  }
  g.restore();
}
function render() {
  const g = Kit.begin('#2a2418');
  if (S.shake > 0) g.translate(rand(-3, 3) * S.shake * 2, rand(-3, 3) * S.shake * 2);
  // floor
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) { g.fillStyle = (x + y) % 2 ? '#3a3226' : '#363023'; g.fillRect(x * TS, OY + y * TS, TS, TS); }
  if (S.mode === 'title') { drawTitle(g); Kit.end(); return; }
  if (S.decal) g.drawImage(S.decal, 0, 0, 480, 360);
  // walls
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    const c = S.grid[y][x], px = x * TS, py = OY + y * TS;
    if (c === '#') {
      const sg = g.createLinearGradient(px, py, px, py + TS); sg.addColorStop(0, '#9aa2b0'); sg.addColorStop(1, '#4a505c');
      g.fillStyle = sg; g.fillRect(px, py, TS, TS); g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(px, py + TS - 2, TS, 2); g.fillRect(px + TS - 2, py, 2, TS);
      g.fillStyle = '#c8ccd4'; for (const [a, b] of [[4, 4], [15, 4], [4, 15], [15, 15]]) g.fillRect(px + a, py + b, 2, 2);
    } else if (c === 'b') {
      const hp = S.bricks[y * GW + x] || 2;
      g.fillStyle = hp > 1 ? '#a24a22' : '#7a3618'; g.fillRect(px, py, TS, TS);
      g.fillStyle = '#d8b090'; g.globalAlpha = 0.35;
      for (let r = 0; r < 4; r++) { g.fillRect(px, py + r * 5, TS, 1); for (let k = 0; k < 3; k++) g.fillRect(px + ((r % 2) * 4 + k * 8) % TS, py + r * 5, 1, 5); }
      g.globalAlpha = 1; if (hp < 2) { g.strokeStyle = '#1a0a04'; g.beginPath(); g.moveTo(px + 4, py + 3); g.lineTo(px + 10, py + 11); g.lineTo(px + 7, py + 17); g.stroke(); }
    } else if (c === 'w') {
      g.fillStyle = '#1a5a9a'; g.fillRect(px, py, TS, TS);
      g.fillStyle = 'rgba(255,255,255,.25)'; const o = (Kit.t * 8 + x * 5) % TS; g.fillRect(px + o * 0.5, py + 6, 6, 1); g.fillRect(px + ((o + 10) % TS) * 0.8, py + 14, 5, 1);
    }
  }
  for (const m of S.mines) { g.fillStyle = m.arm > 0 ? '#555' : (Kit.blink(3) ? '#ff3b3b' : '#600'); g.beginPath(); g.arc(m.x, m.y, 4.5, 0, TAU); g.fill(); g.strokeStyle = '#ffd21f'; g.lineWidth = 1; g.stroke(); }
  for (const d of S.drops) { if (d.life < 3 && Kit.blink(4)) continue; g.fillStyle = { R: '#ff3b3b', S: '#2fe6ff', B: '#ffd21f', W: '#3bff4a' }[d.k]; g.beginPath(); g.roundRect(d.x - 7, d.y - 7, 14, 14, 3); g.fill(); Kit.text(d.k, d.x, d.y + 0.5, 9, '#000', 'center', { stroke: false, italic: false }); }
  for (const t of S.tanks) drawTank(g, t);
  for (const s of S.shells) { g.fillStyle = s.owner.kind === 'player' ? '#fff' : '#ffd21f'; g.beginPath(); g.arc(s.x, s.y, s.r, 0, TAU); g.fill(); g.fillStyle = 'rgba(255,200,80,.35)'; g.beginPath(); g.arc(s.x - s.vx * 0.02, s.y - s.vy * 0.02, s.r * 0.8, 0, TAU); g.fill(); }
  S.smoke.draw(g); S.fx.draw(g);
  if (S.mouse && S.player && !S.player.dead) { g.strokeStyle = 'rgba(47,230,255,.7)'; g.lineWidth = 1; g.beginPath(); g.arc(S.mouse.x, S.mouse.y, 6, 0, TAU); g.moveTo(S.mouse.x - 9, S.mouse.y); g.lineTo(S.mouse.x + 9, S.mouse.y); g.moveTo(S.mouse.x, S.mouse.y - 9); g.lineTo(S.mouse.x, S.mouse.y + 9); g.stroke(); }
  // HUD
  g.fillStyle = '#000'; g.fillRect(0, 0, 480, OY);
  Kit.mono('SCORE ' + String(S.score).padStart(6, '0'), 8, 10, 11, '#fff');
  Kit.mono('ARENA ' + (S.level + 1), 148, 10, 11, '#ffd21f', 'center');
  Kit.mono('HI ' + String(Math.max(S.hi, S.score)).padStart(6, '0'), 222, 10, 11, '#8a85a8', 'center');
  if (S.player) {
    const P = S.player, hp = P.dead ? 0 : P.hp, cols = ['#ff3b1f', '#ff8a1f', '#ffd21f', '#9aff4a', '#3bff4a'];
    Kit.mono('ARMOR', 268, 10, 8, '#aaa');
    for (let i = 0; i < P.T.hp; i++) { g.fillStyle = '#222'; g.fillRect(298 + i * 11, 5, 9, 10); if (i < hp) { g.fillStyle = hp === 1 && Kit.blink(4) ? '#fff' : cols[hp - 1]; g.fillRect(299 + i * 11, 6, 7, 8); } }
  }
  for (let i = 0; i < S.lives; i++) { g.fillStyle = '#2fe6ff'; g.fillRect(402 + i * 13, 6, 10, 8); g.fillStyle = '#111'; g.fillRect(407 + i * 13, 9, 7, 2); }
  const left = S.queue.length + S.tanks.filter(t => t.kind !== 'player' && !t.dead).length; Kit.mono('×' + left, 474, 10, 11, '#ff3b3b', 'right');
  if (S.player && S.player.cool > 0) { g.fillStyle = '#333'; g.fillRect(358, 7, 38, 6); g.fillStyle = '#2fe6ff'; g.fillRect(358, 7, 38 * (1 - S.player.cool / 2.5), 6); }
  if (S.msgT > 0) Kit.text(S.msg, 240, 190, 26, '#ffd21f', 'center', { glow: '#000' });
  if (S.paused) { g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, 0, 480, 360); Kit.text('PAUSED', 240, 180, 30, '#ffd21f'); }
  if (S.mode === 'over') { g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(0, 0, 480, 360); Kit.text('GAME OVER', 240, 170, 34, '#ff3b3b'); if (S.newHi) Kit.text('NEW HIGH SCORE!', 240, 206, 16, '#ffd21f'); }
  Kit.end();
}
function drawTitle(g) {
  g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(0, 0, 480, 360);
  Kit.text('TURBO', 240, 72, 52, '#ffd21f', 'center', { glow: '#ff6a00' });
  Kit.text('TANKS', 240, 120, 52, '#ff3b3b', 'center', { glow: '#ff3b3b' });
  let i = 0; for (const k in TYPES) { const t = makeTank(k, 0, 0); t.x = 96 + i * 72; t.y = 170; t.ang = -Math.PI / 2 + Math.sin(Kit.t + i) * 0.4; t.tur = t.ang; drawTank(g, t); Kit.mono(k.toUpperCase(), t.x, 192, 8, '#ddd', 'center'); Kit.mono(TYPES[k].pts + '', t.x, 204, 8, '#ffd21f', 'center'); i++; }
  Kit.mono('MOVE: stick / arrows / WASD   FIRE: A · J · Space · click', 240, 232, 9, '#fff', 'center');
  Kit.mono('MINE: B · K     TURBO DASH: C · L     Shells ricochet off steel', 240, 246, 9, '#fff', 'center');
  Kit.mono('Your tank takes 5 hits · green W crates repair it', 240, 260, 9, '#3bff4a', 'center');
  if (Kit.blink()) Kit.text('PRESS START', 240, 290, 22, '#ffd21f');
  Kit.mono('HI ' + String(S.hi).padStart(6, '0'), 240, 322, 10, '#8a85a8', 'center');
}

/* ---------- boot ---------- */
S.hi = Kit.hi('turbo-tanks');
Kit.init({
  W: 480, H: 360, render, touchLabels: { a: 'FIRE', b: 'MINE', c: 'TURBO' },
  update: dt => { if (S.mode === 'title' && Kit.hit('a')) newGame(); else update(dt); },
  onStart() { if (S.mode === 'title') newGame(); else if (S.mode === 'play') S.paused = !S.paused; },
  onPause() { if (S.mode === 'play') S.paused = !S.paused; },
  onTitle() { return S.mode === 'title'; },
});
// a mouse aims the turret and clicks fire (desktop); touch uses the on-screen buttons
Kit.canvas.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' && S.mode === 'play') S.mouse = Kit.toLogical(e.clientX, e.clientY); });
Kit.canvas.addEventListener('pointerdown', e => { Kit.audioInit(); if (S.mode === 'title') { newGame(); return; } if (e.pointerType === 'mouse') { S.mouse = Kit.toLogical(e.clientX, e.clientY); S.click = true; } });
Kit.canvas.addEventListener('pointerleave', () => { S.mouse = null; });

</script>
